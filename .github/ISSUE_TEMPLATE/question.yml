name: Question
description: Ask a question about usage, architecture, or anything else.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any relevant code snippets, links, or background information.
    validations:
      required: false
